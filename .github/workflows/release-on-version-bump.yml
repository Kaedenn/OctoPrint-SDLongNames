name: Release current version

on:
  push:
    branches:
      - main
    paths:
      - pyproject.toml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-current-version
  cancel-in-progress: false

jobs:
  release:
    name: Build and release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read project version
        id: version
        shell: bash
        run: |
          version="$(
            python - <<'PY'
          from pathlib import Path
          import tomllib

          data = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          print(data["project"]["version"])
          PY
          )"

          if [[ -z "$version" ]]; then
            echo "Could not determine project version" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Detected version $version"

      - name: Check whether release exists
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $TAG already exists; nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Release $TAG does not exist."
          fi

      - name: Install build tools
        if: steps.release.outputs.exists == 'false'
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Validate Python
        if: steps.release.outputs.exists == 'false'
        run: |
          python -m compileall -q octoprint_sdlongnames

      - name: Validate JavaScript
        if: steps.release.outputs.exists == 'false'
        run: |
          node --check octoprint_sdlongnames/static/js/sdlongnames.js

      - name: Build distributions
        if: steps.release.outputs.exists == 'false'
        run: |
          rm -rf build dist ./*.egg-info
          python -m build

      - name: Validate distributions
        if: steps.release.outputs.exists == 'false'
        run: |
          python -m twine check dist/*

          test "$(find dist -maxdepth 1 -name '*.whl' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 1

          ls -lh dist/

      - name: Verify built version
        if: steps.release.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          python - <<'PY'
          import email
          import os
          import pathlib
          import zipfile

          expected = os.environ["VERSION"]
          wheels = list(pathlib.Path("dist").glob("*.whl"))

          if len(wheels) != 1:
              raise SystemExit(f"Expected one wheel, found {len(wheels)}")

          with zipfile.ZipFile(wheels[0]) as archive:
              metadata_name = next(
                  name for name in archive.namelist()
                  if name.endswith(".dist-info/METADATA")
              )
              metadata = email.message_from_bytes(archive.read(metadata_name))

          actual = metadata["Version"]
          if actual != expected:
              raise SystemExit(
                  f"Built wheel version {actual!r} does not match "
                  f"pyproject.toml version {expected!r}"
              )

          print(f"Verified package version {actual}")
          PY

      - name: Create GitHub release
        if: steps.release.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" \
            dist/*.whl \
            dist/*.tar.gz \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes
